services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - public_subnet
      - private_subnet

  backend1:
    build: .
    environment:
      SERVER_ID: backend1
    expose:
      - "3000"
    networks:
      - private_subnet
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3

  backend2:
    build: .
    environment:
      SERVER_ID: backend2
    expose:
      - "3000"
    networks:
      - private_subnet
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3

networks:
  public_subnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
  private_subnet:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.20.0/24
