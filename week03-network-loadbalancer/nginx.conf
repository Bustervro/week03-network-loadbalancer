worker_processes 1;

events {
    worker_connections 1024;
}

http {
    log_format upstream_info '$remote_addr "$request" status=$status '
                             'upstream=$upstream_addr duration=$request_time';
    access_log /dev/stdout upstream_info;
    error_log /dev/stderr warn;

    upstream app_servers {
        # Default behavior is round-robin.
        server backend1:3000 max_fails=1 fail_timeout=5s;
        server backend2:3000 max_fails=1 fail_timeout=5s;
        keepalive 16;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            add_header X-Load-Balancer nginx always;
        }
    }
}
